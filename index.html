<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GeoGebra PowerPoint Custom</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        #ggb-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Script officiel d'intégration GeoGebra -->
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>
    <div id="ggb-container"></div>

    <script>
        var parameters = {
            "id": "ggbApplet",
            "width": window.innerWidth,
            "height": window.innerHeight,
            "showAlgebraInput": true,
            "showMenuBar": true,
            "showToolBar": true,
            "enableLabelDrags": true,
            "material_id": "v5ff8ftq" // Remplacez par l'identifiant de votre activité GeoGebra
        };

        var applet = new GGBApplet(parameters, true);
        window.addEventListener("load", function() {
            applet.inject('ggb-container');
        });

        // Redimensionnement automatique si le volet PowerPoint est redimensionné
        window.addEventListener("resize", function() {
            if (window.ggbApplet && typeof window.ggbApplet.setSize === "function") {
                window.ggbApplet.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
